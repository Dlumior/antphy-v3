name: clients-docs

on:
  push:
    branches: [main]
    paths:
      [
        "clients/**",
        "docs/**",
        "contracts/**",
        "package.json",
        "pnpm-workspace.yaml",
        "pnpm-lock.yaml",
        "vite.config.ts",
        ".github/workflows/clients.yml",
      ]
  pull_request:
    paths:
      [
        "clients/**",
        "docs/**",
        "contracts/**",
        "package.json",
        "pnpm-workspace.yaml",
        "pnpm-lock.yaml",
        "vite.config.ts",
        ".github/workflows/clients.yml",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # Fuera del repo: npm ≥ 11 rechaza npx aquí porque devEngines declara pnpm.
      - name: Instalar Vite+
        working-directory: ${{ runner.temp }}
        run: npm install -g vite-plus@1.4.0
      # La vp global solo instala; el resto usa la del proyecto (si no, Vitest carga dos copias).
      - run: vp install --frozen-lockfile
      - run: node_modules/.bin/vp check
      - run: node_modules/.bin/vp run -r test
      - run: node_modules/.bin/vp run -r build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/dist
