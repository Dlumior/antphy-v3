name: report

on:
  push:
    branches: [main]
    paths: ["report/**", ".github/workflows/report.yml"]
  pull_request:
    paths: ["report/**", ".github/workflows/report.yml"]

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
          latexmk_use_lualatex: false
      - uses: actions/upload-artifact@v4
        with:
          name: informe
          path: report/build/main.pdf
