packages:
  - clients/web
  - clients/packages/*
  - docs

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - astro@7.4.5

# Paquetes autorizados a ejecutar scripts de instalación
allowBuilds:
  sharp: true
  esbuild: true
