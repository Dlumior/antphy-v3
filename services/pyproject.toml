[project]
name = "antphy-services"
version = "0.1.0"
description = "Backend de antphy-v3: monolito modular (API + worker)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.scripts]
antphy-api = "antphy_services.apps.api.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antphy_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert en tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["antphy_services"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "fakeredis.*"]
ignore_missing_imports = true

# Los módulos de negocio no se importan entre sí: se comunican por puertos o eventos.
# Esto es lo que permite separarlos en servicios más adelante.
[tool.importlinter]
root_package = "antphy_services"

[[tool.importlinter.contracts]]
name = "Módulos independientes"
type = "independence"
modules = [
    "antphy_services.modules.scenarios",
    "antphy_services.modules.incidents",
    "antphy_services.modules.fleet",
    "antphy_services.modules.routing_matrix",
    "antphy_services.modules.optimization",
    "antphy_services.modules.identity",
]

[[tool.importlinter.contracts]]
name = "Los módulos no dependen de las apps"
type = "forbidden"
source_modules = ["antphy_services.modules", "antphy_services.shared"]
forbidden_modules = ["antphy_services.apps"]

[[tool.importlinter.contracts]]
name = "Capas dentro de optimization"
type = "layers"
layers = [
    "antphy_services.modules.optimization.api : antphy_services.modules.optimization.infrastructure",
    "antphy_services.modules.optimization.application",
    "antphy_services.modules.optimization.domain",
]
